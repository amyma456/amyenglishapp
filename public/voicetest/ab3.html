<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>发音三通道对比 · Cloudflare / 阿里云 / Azure</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; padding: 16px; background: #f5f7fa; color: #222; }
  h1 { font-size: 18px; margin: 4px 0 2px; }
  .sub { font-size: 13px; color: #667; margin-bottom: 14px; line-height: 1.6; }
  .card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .en { font-size: 16px; font-weight: 600; line-height: 1.5; }
  .cn { font-size: 13px; color: #889; margin-top: 2px; }
  .row { display: flex; gap: 6px; margin-top: 10px; }
  button { flex: 1; border: 0; border-radius: 10px; padding: 9px 4px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .b-cf  { background: #f3e8ff; color: #6b21a8; }
  .b-ali { background: #eef3ff; color: #2456d6; }
  .b-az  { background: #eafaf1; color: #0a7d43; }
  .src { font-size: 11px; color: #99a; margin-top: 6px; min-height: 14px; }
  .pick { margin-top: 8px; display: flex; gap: 6px; }
  .pick button { background: #fff; border: 1px solid #dde; color: #556; font-weight: 500; }
  .pick button.on { background: #fff7e0; border-color: #e8b93e; color: #8a6100; }
  .tally { position: sticky; top: 0; background: #f5f7fa; padding: 8px 2px; font-size: 13px; color: #556; }
  .tally b { color: #222; }
</style>
</head>
<body>
<h1>发音三通道对比</h1>
<p class="sub">同一句话，三个 AI 朗读通道各放一遍：<b style="color:#6b21a8">Cloudflare（紫）</b> · <b style="color:#2456d6">阿里云（蓝）</b> · <b style="color:#0a7d43">Azure 微软神经语音（绿，线上现在用的）</b>。每句都点三下对比，然后点"哪个好"记一票。</p>
<div class="tally" id="tally"></div>
<div id="list"></div>
<p class="sub">试听完把结果告诉 Amy 老师。</p>
<script>
var SAMPLES = [
  { t: "passport", cn: "单词 · 护照（听写题）" },
  { t: "There are some apples.", cn: "句子 · 填空跟读" },
  { t: "Which picture matches the sentence you hear?", cn: "指令 · 听力题干" },
  { t: "What's your favorite subject at school?", cn: "口语 · 常用问句" },
  { t: "be afraid of", cn: "词组 · 害怕（本周拼写）" },
  { t: "wild animals", cn: "词组 · 野生动物" },
  { t: "a long time ago", cn: "词组 · 很久以前" }
];
var CH = [
  { k: 'cf',    label: '▶ Cloudflare', cls: 'b-cf' },
  { k: 'ali',   label: '▶ 阿里云',      cls: 'b-ali' },
  { k: 'azure', label: '▶ Azure',       cls: 'b-az' }
];
var picks = {};
try { picks = JSON.parse(localStorage.getItem('tts-ab3-picks') || '{}'); } catch (e) {}
var list = document.getElementById('list');
function srcLabel(x) {
  var m = { static: '静态缓存', azure: 'Azure ✓', aliyun: '阿里云 ✓', cf: 'Cloudflare ✓', youdao: '有道', fallback: '免费兜底' };
  return '实际发音：' + (m[x] || x);
}
function renderTally() {
  var n = { cf: 0, ali: 0, azure: 0 };
  for (var i in picks) if (n[picks[i]] !== undefined) n[picks[i]]++;
  document.getElementById('tally').innerHTML =
    '投票：<b>Cloudflare ' + n.cf + '</b> · <b>阿里云 ' + n.ali + '</b> · <b>Azure ' + n.azure + '</b>';
}
SAMPLES.forEach(function (s, i) {
  var d = document.createElement('div');
  d.className = 'card';
  var btns = CH.map(function (c) {
    return '<button class="' + c.cls + '" data-i="' + i + '" data-e="' + c.k + '">' + c.label + '</button>';
  }).join('');
  var pickBtns = CH.map(function (c) {
    return '<button data-i="' + i + '" data-p="' + c.k + '">👍 ' + c.k.toUpperCase() + '</button>';
  }).join('');
  d.innerHTML = '<div class="en">' + s.t + '</div><div class="cn">' + s.cn + '</div>'
    + '<div class="row">' + btns + '</div><div class="src" id="src-' + i + '"></div>'
    + '<div class="pick">' + pickBtns + '</div>';
  list.appendChild(d);
  if (picks[i]) {
    d.querySelectorAll('.pick button').forEach(function (b) {
      if (b.dataset.p === picks[i]) b.classList.add('on');
    });
  }
});
var audio = new Audio();
function play(i, e) {
  var lab = document.getElementById('src-' + i);
  lab.textContent = '加载中…';
  audio.src = '/api/tts?engine=' + e + '&text=' + encodeURIComponent(SAMPLES[i].t) + '&v=ab3';
  fetch(audio.src, { method: 'HEAD' }).then(function (r) {
    var s = r.headers.get('X-TTS-Source');
    lab.textContent = srcLabel(s || '?');
  }).catch(function () { lab.textContent = ''; });
  audio.play().catch(function () { lab.textContent = '播放失败，再点一次'; });
}
list.addEventListener('click', function (ev) {
  var b = ev.target.closest('button');
  if (!b) return;
  if (b.dataset.e) play(+b.dataset.i, b.dataset.e);
  else if (b.dataset.p) {
    var i = b.dataset.i;
    picks[i] = b.dataset.p;
    b.parentElement.querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); });
    b.classList.add('on');
    try { localStorage.setItem('tts-ab3-picks', JSON.stringify(picks)); } catch (e) {}
    renderTally();
  }
});
renderTally();
</script>
</body>
</html>
